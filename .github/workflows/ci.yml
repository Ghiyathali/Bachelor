name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ASP.NET + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The solution contains rest-server and rest-server.Tests.
      - name: Restore
        run: dotnet restore Pangaea.slnx

      - name: Build
        run: dotnet build Pangaea.slnx --no-restore --configuration Release

      # Integration tests start their own PostgreSQL in Docker (Testcontainers);
      # Docker is already available on GitHub's ubuntu runners.
      - name: Test
        run: dotnet test Pangaea.slnx --no-build --configuration Release

  frontend:
    name: Frontend (Electron + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron-react-app
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron-react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Role permission tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  feedback-form:
    name: Feedback form (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-form
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: feedback-form/package-lock.json

      - name: Install dependencies
        run: npm ci

      # "build" runs tsc --noEmit (type-check) and then vite build.
      - name: Build
        run: npm run build